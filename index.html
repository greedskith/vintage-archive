.font-bankgothic {
  font-family: 'BankGothic-Embedded', 'BankGothic', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace, sans-serif;
  letter-spacing: 0.04em;
}


    /* Curated Chill Design 2-Color Themes */
    :root, [data-theme="coral"] {
      --ground: #000000;
      --accent: #F16460; /* Coral Noir */
    }
    [data-theme="cyan"] {
      --ground: #000000;
      --accent: #00ECFF; /* Cyan Noir */
    }
    [data-theme="seafoam"] {
      --ground: #000000;
      --accent: #32A578; /* Seafoam Noir */
    }

    *, ::before, ::after {
      border-color: var(--accent);
    }

    body {
      background-color: var(--ground);
      color: var(--accent);
    }

    .theme-accent-text {
      color: var(--accent);
    }
    .theme-accent-bg {
      background-color: var(--accent);
    }
    .theme-accent-border {
      border-color: var(--accent);
    }

    ::selection {
      background: var(--accent);
      color: #000000;
    }

    .crt-screen {
      position: relative;
      background: #000000;
    }
    .crt-screen::before {
      content: " ";
      display: block;

        const data = await res.json();

    function cycleText(token) {
      const input = document.getElementById('search-input');
      let val = input.value;

      if (isCycling && lastInjected && val.endsWith(lastInjected)) {
        // Replace previous candidate
        val = val.substring(0, val.length - lastInjected.length) + token;
      } else {
        // Append new token
        if (val.length > 0 && !val.endsWith(' ')) {
          val += ' ';
        }
        val += token;
      }

      lastInjected = token;
      isCycling = true;
      input.value = val;
      input.focus();
    }

    function addWord() {
      const randomIndex = Math.floor(Math.random() * wordCache.length);
      cycleText(wordCache[randomIndex]);
    }

    function addPhrase() {
      const randomIndex = Math.floor(Math.random() * phraseCache.length);
      cycleText(phraseCache[randomIndex]);
    }

    /* --- SEARCH QUOTA TRACKERS --- */
    function getTodayKey() {
      return new Date().toISOString().substring(0, 10);

    function initQuotaCounters() {
      const storedDate = localStorage.getItem('yt_quota_date');
      const today = getTodayKey();
      if (storedDate !== today) {
        localStorage.setItem('yt_quota_date', today);
        localStorage.setItem('yt_quota_used', '0');
        localStorage.setItem('yt_quota_exhausted', 'false');
      }

      const isExhausted = localStorage.getItem('yt_quota_exhausted') === 'true';
      const used = parseInt(localStorage.getItem('yt_quota_used') || '0', 10);
      const remainingYT = isExhausted ? 0 : Math.max(0, 100 - used);
      
      updateYoutubeQuota(remainingYT);
      fetchVimeoRateLimit();
    }

    /* --- DURATION PARSERS --- */
    function parseArchiveDuration(runtime) {
      if (!runtime) return 0;
      if (typeof runtime === 'number') return runtime;
      const parts = runtime.toString().trim().split(':').map(Number);
      if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
      if (parts.length === 2) return parts[0] * 60 + parts[1];
      return parseInt(runtime, 10) || 0;
    }

    function parseISO8601Duration(iso) {
      if (!iso) return 0;
      const match = iso.match(/PT(?:(\d+)D)?(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
      if (!match) return 0;
      const days = parseInt(match[1] || 0, 10);
      const hours = parseInt(match[2] || 0, 10);
      const minutes = parseInt(match[3] || 0, 10);
      const seconds = parseInt(match[4] || 0, 10);
      return (days * 86400) + (hours * 3600) + (minutes * 60) + seconds;
    }

    function formatDuration(totalSeconds) {
      if (!totalSeconds || isNaN(totalSeconds)) return "0:00";
      const h = Math.floor(totalSeconds / 3600);
      const m = Math.floor((totalSeconds % 3600) / 60);
      const s = Math.floor(totalSeconds % 60);
      const pad = (n) => n.toString().padStart(2, '0');
      if (h > 0) {
        return `${h}:${pad(m)}:${pad(s)}`;
      }
      return `${m}:${pad(s)}`;
    }

    async function handleSearch(e) {
      if (e) e.preventDefault();
      const query = document.getElementById('search-input').value.trim();
      const cutoffDate = document.getElementById('year-select').value;
      if (!query) return;

      const minVal = parseFloat(document.getElementById('min-time').value);
      const maxVal = parseFloat(document.getElementById('max-time').value);
      const hasMin = !isNaN(minVal) && minVal > 0;
      const hasMax = !isNaN(maxVal) && maxVal > 0;

      const minSec = hasMin ? minVal * 60 : 0;
      const maxSec = hasMax ? maxVal * 60 : Infinity;

      const btn = document.getElementById('search-btn');
      btn.textContent = "SEARCHING";

      try {
        if (currentPlatform === 'archive') {
          // Internet Archive Search API (Public Domain, Free, No API Key)
          let dateFilter = "";
          if (cutoffDate) {
            dateFilter = ` AND date:[* TO ${cutoffDate}T23:59:59Z]`;
          }

          let ratingFilter = "";
          if (currentRating === 'safe') {
            ratingFilter = " AND NOT (subject:adult OR subject:erotica OR subject:porn)";
          } else if (currentRating === 'explicit') {
            ratingFilter = " AND (subject:adult OR subject:erotica OR subject:exploitation)";
          }

          const iaUrl = `https://archive.org/advancedsearch.php?q=mediatype:movies AND (${encodeURIComponent(query)})${dateFilter}${ratingFilter}&fl[]=identifier,title,creator,date,runtime&sort[]=downloads desc&rows=50&output=json`;

          const res = await fetch(iaUrl);
          const data = await res.json();
          const docs = data.response?.docs || [];
          let finalVideos = [];

          docs.forEach(doc => {
            const rawDate = doc.date ? doc.date.substring(0, 10) : "";
            const durSec = parseArchiveDuration(doc.runtime);

            if (durSec > 0 && (durSec < minSec || durSec > maxSec)) return;

            finalVideos.push({
              id: doc.identifier,
              title: doc.title || doc.identifier,
              channel: doc.creator || "Archive.org Contributor",
              date: rawDate,
              duration: formatDuration(durSec) || doc.runtime || "0:00",
              durationSec: durSec,
              isExplicit: currentRating === 'explicit'
            });
          });

          renderReel(finalVideos);

          if (finalVideos.length > 0) {
            playVideo(finalVideos[0].id, escape(finalVideos[0].title), escape(finalVideos[0].channel), finalVideos[0].date, finalVideos[0].duration);
          }
        } else if (currentPlatform === 'bilibili') {
          // Bilibili Search via Local Daemon Proxy
          if (currentRating === 'explicit') {
            document.getElementById('results-reel').innerHTML = `
              <div class="w-full border theme-accent-border p-6 text-center text-xs">
                Bilibili strictly bans 18+ content under NRTA regulations. No explicit results found.
              </div>
            `;
            return;
          }

          let biliRes;
          try {
            biliRes = await fetch('/api/bilibili?q=' + encodeURIComponent(query));
            if (!biliRes.ok) throw new Error('Local proxy not available');
          } catch(e) {
            biliRes = await fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent('https://api.bilibili.com/x/web-interface/search/type?search_type=video&keyword=' + encodeURIComponent(query)));
          }

          const biliData = await biliRes.json();
          const items = biliData.data?.result || [];
          let finalVideos = [];

          items.forEach(item => {
            const pubDate = item.pubdate ? new Date(item.pubdate * 1000).toISOString().substring(0, 10) : "";
            const cleanTitle = (item.title || "").replace(/<[^>]+>/g, "");

            let durSec = 0;
            if (typeof item.duration === 'string') {
              const parts = item.duration.split(':').map(Number);
              if (parts.length === 3) durSec = parts[0] * 3600 + parts[1] * 60 + parts[2];
              else if (parts.length === 2) durSec = parts[0] * 60 + parts[1];
              else durSec = parseInt(item.duration, 10) || 0;
            } else if (typeof item.duration === 'number') {
              durSec = item.duration;
            }

            if ((!cutoffDate || pubDate <= cutoffDate) && durSec >= minSec && durSec <= maxSec) {
              finalVideos.push({
                id: item.bvid,
                title: cleanTitle || "Untitled",
                channel: item.author || "Bilibili Creator",
                date: pubDate,
                duration: formatDuration(durSec),
                durationSec: durSec,
                isExplicit: false
              });
            }
          });

          renderReel(finalVideos);

          if (finalVideos.length > 0) {
            playVideo(finalVideos[0].id, escape(finalVideos[0].title), escape(finalVideos[0].channel), finalVideos[0].date, finalVideos[0].duration);
          }
        } else if (currentPlatform === 'dailymotion') {
          // DailyMotion Public API (No key required, unlimited searches)
          const familyFilterParam = currentRating === 'safe' ? '&family_filter=true' : '&family_filter=false';
          const cutoffParam = cutoffDate ? `&created_before=${Math.floor(new Date(cutoffDate + 'T00:00:00Z').getTime() / 1000)}` : '';
          const shorterParam = hasMax ? `&shorter_than=${Math.ceil(maxVal)}` : '';
          const longerParam = hasMin ? `&longer_than=${Math.floor(minVal)}` : '';
          
          const dmUrl = `https://api.dailymotion.com/videos?search=${encodeURIComponent(query)}&fields=id,title,owner_screenname,created_time,duration,explicit${familyFilterParam}${cutoffParam}${shorterParam}${longerParam}&limit=50`;
          const res = await fetch(dmUrl);
          const data = await res.json();
          if (data.error) throw new Error(data.error.message || "DailyMotion search failed");

          const items = data.list || [];
          let finalVideos = [];

          items.forEach(item => {
            const itemDate = item.created_time ? new Date(item.created_time * 1000).toISOString().substring(0, 10) : "";
            const durSec = item.duration || 0;
            const isExplicit = Boolean(item.explicit);

            if (currentRating === 'safe' && isExplicit) return;
            if (currentRating === 'explicit' && !isExplicit) return;

            if ((!cutoffDate || itemDate <= cutoffDate) && durSec >= minSec && durSec <= maxSec) {
              finalVideos.push({
                id: item.id,
                title: item.title || "Untitled",
                channel: item.owner_screenname || "DailyMotion Creator",
                date: itemDate,
                duration: formatDuration(durSec),
                durationSec: durSec,
                isExplicit: isExplicit
              });
            }
          });

          renderReel(finalVideos);

          if (finalVideos.length > 0) {
            playVideo(finalVideos[0].id, escape(finalVideos[0].title), escape(finalVideos[0].channel), finalVideos[0].date, finalVideos[0].duration);
          }
        } else if (currentPlatform === 'vimeo') {
          // Vimeo Search API (Single unified call)
          const vimeoUrl = `https://api.vimeo.com/videos?query=${encodeURIComponent(query)}&sort=relevant&per_page=50`;
          const res = await fetch(vimeoUrl, {
            headers: {
              'Authorization': `Bearer ${VIMEO_TOKEN}`,
              'Accept': 'application/vnd.vimeo.*+json;version=3.4'
            }
          });
          const vimeoRem = res.headers.get('X-RateLimit-Remaining');
          const vimeoLim = res.headers.get('X-RateLimit-Limit');
          if (vimeoRem !== null) {
            updateVimeoQuota(vimeoRem, vimeoLim);
          }
          const data = await res.json();
          if (data.error) throw new Error(data.error);

          const items = data.data || [];
          let finalVideos = [];

          items.forEach(item => {
            const itemDate = item.created_time ? item.created_time.substring(0, 10) : "";
            const durSec = item.duration || 0;
            const uriParts = item.uri ? item.uri.split('/') : [];
            const vidId = uriParts[uriParts.length - 1];

            // Content rating check
            const ratingClass = (item.content_rating_class || "").toLowerCase();
            const ratings = Array.isArray(item.content_rating) ? item.content_rating.map(r => r.toLowerCase()) : [];
            const isExplicit = ratingClass === 'explicit' || ratings.some(r => ['nudity', 'violence', 'drugs', 'mature', 'unrated_explicit'].includes(r));

            if (currentRating === 'safe' && isExplicit) return;
            if (currentRating === 'explicit' && !isExplicit) return;

            // Strict vintage cutoff & duration range filter
            if ((!cutoffDate || itemDate <= cutoffDate) && durSec >= minSec && durSec <= maxSec) {
              finalVideos.push({
                id: vidId,
                title: item.name || "Untitled",
                channel: item.user ? item.user.name : "Vimeo Creator",
                date: itemDate,
                duration: formatDuration(durSec),
                durationSec: durSec,
                isExplicit: isExplicit
              });
            }
          });

          renderReel(finalVideos);

          if (finalVideos.length > 0) {
            playVideo(finalVideos[0].id, escape(finalVideos[0].title), escape(finalVideos[0].channel), finalVideos[0].date, finalVideos[0].duration);
          }
        } else {
          // YouTube Search API (Search + Batch Videos Details)
          let searchDurationParam = "";
          if (hasMax && maxVal <= 4) {
            searchDurationParam = "&videoDuration=short";
          } else if (hasMin && minVal >= 4 && hasMax && maxVal <= 20) {
            searchDurationParam = "&videoDuration=medium";
          } else if (hasMin && minVal >= 20) {
            searchDurationParam = "&videoDuration=long";
          }

          let safeSearchParam = "";
          if (currentRating === 'safe') {
            safeSearchParam = "&safeSearch=strict";
          } else {
            safeSearchParam = "&safeSearch=none";
          }

          const cutoffParam = cutoffDate ? `&publishedBefore=${cutoffDate}T00:00:00Z` : "";
          const searchUrl = `https://www.googleapis.com/youtube/v3/search?part=snippet&q=${encodeURIComponent(query)}&type=video${searchDurationParam}${cutoffParam}${safeSearchParam}&maxResults=40&key=${YOUTUBE_API_KEY}`;
          const res = await fetch(searchUrl);
          const data = await res.json();

          if (data.error) throw new Error(data.error.message || "Search failed");

          const items = data.items || [];
          const videoIds = items.map(item => item.id.videoId).filter(Boolean);

          let finalVideos = [];

          if (videoIds.length > 0) {
            const detailsUrl = `https://www.googleapis.com/youtube/v3/videos?part=contentDetails,snippet&id=${videoIds.join(',')}&key=${YOUTUBE_API_KEY}`;
            const detailsRes = await fetch(detailsUrl);
            const detailsData = await detailsRes.json();

            const durationMap = {};
            if (detailsData.items) {
              detailsData.items.forEach(it => {
                const sec = parseISO8601Duration(it.contentDetails?.duration);
                durationMap[it.id] = {
                  sec: sec,
                  formatted: formatDuration(sec)
                };
              });
            }

            items.forEach(item => {
              const id = item.id.videoId;
              const dur = durationMap[id] || { sec: 0, formatted: "0:00" };
              
              if (dur.sec >= minSec && dur.sec <= maxSec) {
                finalVideos.push({
                  id: id,
                  title: item.snippet.title,
                  channel: item.snippet.channelTitle,
                  date: item.snippet.publishedAt.substring(0, 10),
                  duration: dur.formatted,
                  durationSec: dur.sec
                });
              }
            });
          }

          // Deduct from local YouTube daily tracker on successful search
          const used = parseInt(localStorage.getItem('yt_quota_used') || '0', 10) + 1;
          localStorage.setItem('yt_quota_used', used.toString());
          updateYoutubeQuota(Math.max(0, 100 - used));

          renderReel(finalVideos);

          if (finalVideos.length > 0) {
            playVideo(finalVideos[0].id, escape(finalVideos[0].title), escape(finalVideos[0].channel), finalVideos[0].date, finalVideos[0].duration);
          }
        }
      } catch (err) {
        console.error(err);
        let errorMsg = err.message || "Search failed. Try again.";
        if (errorMsg.includes("Quota exceeded") || errorMsg.includes("RESOURCE_EXHAUSTED")) {
          localStorage.setItem('yt_quota_exhausted', 'true');
          updateYoutubeQuota(0);
          errorMsg = "YouTube daily search quota reached (100 searches/day). Switch to Vimeo above.";
        }
        document.getElementById('results-reel').innerHTML = `
          <div class="w-full border theme-accent-border p-6 text-center text-xs">
            ${errorMsg}
          </div>
        `;
      } finally {
        btn.textContent = "Search";
      }
    }

    // Initial load
    initQuotaCounters();
    setPlatform('youtube');
    onYearChange();
    loadOnlineWords();
    loadOnlinePhrases();
  </script>

  <!-- Auto-shutdown Heartbeat for Zero Memory Leak -->
  <script>
    function pingHeartbeat() {
      fetch('/heartbeat', { method: 'POST' }).catch(() => {});
    }
    // Ping immediately on load, then every 5 seconds
    pingHeartbeat();
    setInterval(pingHeartbeat, 5000);
  </script>
  <!-- Progressive Web App Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
